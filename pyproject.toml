[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hisaab"
version = "0.1.0"
description = "Open-source, self-hostable expense splitter for India: bank SMS in, UPI splits out."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Sourabh Somani" }]
keywords = ["upi", "expense", "splitwise", "india", "sms", "gradio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "gradio>=5.0",
    "sqlmodel>=0.0.22",
    "rapidfuzz>=3.0",
    "python-dateutil>=2.8",
    "qrcode[pil]>=7.4",
    "pandas>=2.0",
    "defusedxml>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
hisaab = "hisaab.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["hisaab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
