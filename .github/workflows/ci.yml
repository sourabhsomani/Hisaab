name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=hisaab --cov-report=term-missing
      - name: Parser accuracy report
        if: matrix.python-version == '3.12'
        run: python -m hisaab.parsers.report >> "$GITHUB_STEP_SUMMARY"
